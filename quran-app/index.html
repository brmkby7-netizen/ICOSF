<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hifz · Quran Memorization</title>
  <meta name="description" content="Memorize the Quran ayah by ayah with cumulative build-up looping.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hifz">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/kfgqpc-uthmanic-hafs.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-left" id="nav-left"></div>
    <div class="nav-title" id="nav-title" aria-hidden="true"></div>
    <div class="nav-right"></div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <div id="player" class="player" hidden></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-nav="today">
      <span class="tab-icon">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="5.5" width="20" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4 11h20M9.5 3v5M18.5 3v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m10 17 2.6 2.6 5.4-5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="badge" id="due-badge" hidden></span>
      </span>
      <span class="tab-label">Today</span>
    </a>
    <a href="#/" data-nav="">
      <span class="tab-icon">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 7.2C11.3 5.3 7.6 4.8 4 5.1v15.8c3.6-.3 7.3.2 10 2.1 2.7-1.9 6.4-2.4 10-2.1V5.1c-3.6-.3-7.3.2-10 2.1Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 7.2V23" stroke="currentColor" stroke-width="1.9"/></svg>
      </span>
      <span class="tab-label">Surahs</span>
    </a>
    <a href="#/progress" data-nav="progress">
      <span class="tab-icon">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4.5" y="14" width="4.5" height="9.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="11.75" y="9" width="4.5" height="14.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.9"/><rect x="19" y="4.5" width="4.5" height="19" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
      </span>
      <span class="tab-label">Progress</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </span>
      <span class="tab-label">Settings</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="fix-timing" class="sheet">
    <form method="dialog" id="fix-form">
      <div class="grabber" aria-hidden="true"></div>
      <header class="sheet-head">
        <h2 id="fix-title">Adjust timing</h2>
        <button class="sheet-done" value="close">Done</button>
      </header>
      <p class="muted small" id="fix-help">If this ayah starts or stops in the wrong place, move its start or end. Listen to check, then save.</p>

      <div class="fix-row">
        <div class="fix-head"><strong>Start</strong> <span class="mono" id="fix-start"></span></div>
        <div class="nudge">
          <button type="button" data-nudge="start:-1000">−1 s</button>
          <button type="button" data-nudge="start:-200">−0.2</button>
          <button type="button" data-nudge="start:200">+0.2</button>
          <button type="button" data-nudge="start:1000">+1 s</button>
        </div>
        <button type="button" class="btn ghost small-btn" data-hear="start">Hear the start</button>
      </div>

      <div class="fix-row">
        <div class="fix-head"><strong>End</strong> <span class="mono" id="fix-end"></span></div>
        <div class="nudge">
          <button type="button" data-nudge="end:-1000">−1 s</button>
          <button type="button" data-nudge="end:-200">−0.2</button>
          <button type="button" data-nudge="end:200">+0.2</button>
          <button type="button" data-nudge="end:1000">+1 s</button>
        </div>
        <button type="button" class="btn ghost small-btn" data-hear="end">Hear the end</button>
      </div>

      <div class="fix-live">
        <button type="button" class="btn small-btn" data-hear="around">Play around this ayah</button>
        <span class="mono muted small" id="fix-clock"></span>
        <div class="btn-row" id="fix-mark" hidden>
          <button type="button" class="btn primary small-btn" data-mark="start">Start is here</button>
          <button type="button" class="btn primary small-btn" data-mark="end">End is here</button>
        </div>
      </div>

      <label class="row switch-row">
        <span class="row-label">Move neighbouring ayat to match</span>
        <input type="checkbox" class="switch" id="fix-neighbours" checked>
      </label>

      <div class="fix-actions">
        <button type="button" class="btn ghost" data-hear="ayah">▶ Play ayah</button>
        <button type="button" class="btn primary" id="fix-save">Save</button>
      </div>
      <button type="button" class="link small" id="fix-reset">Reset to original timing</button>
    </form>
  </dialog>


  <script type="module" src="js/app.js"></script>
</body>
</html>
