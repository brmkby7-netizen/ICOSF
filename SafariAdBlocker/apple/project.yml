# Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd apple && xcodegen generate && open Bastion.xcodeproj
# Set DEVELOPMENT_TEAM below (or in Xcode) and, if you ship it, change
# BASTION_APP_BUNDLE_ID to an identifier you own.
name: Bastion
options:
  bundleIdPrefix: app.bastion
  deploymentTarget:
    iOS: "16.4"
    macOS: "13.3"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    BASTION_APP_BUNDLE_ID: app.bastion.Bastion
    # iOS App Groups use "group."; macOS sandboxed App Groups are prefixed with the Team ID.
    BASTION_APP_GROUP: group.$(BASTION_APP_BUNDLE_ID)
    "BASTION_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)$(BASTION_APP_BUNDLE_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

aggregateTargets:
  PrepareRules:
    buildScripts:
      - name: Build filter compiler and bundled rules
        script: |
          "${PROJECT_DIR}/../scripts/xcode-prebuild.sh"
        basedOnDependencyAnalysis: false

targetTemplates:
  BastionExtension:
    type: app-extension
    platform: [iOS, macOS]
    entitlements:
      path: Entitlements/Extension-${platform}.entitlements
    dependencies:
      - target: PrepareRules

  ContentBlocker:
    templates: [BastionExtension]
    sources:
      - path: ContentBlocker/ContentBlockerRequestHandler.swift
      - path: Shared
      - path: ContentBlocker/Bundled/${slot}/blockerList.json
        buildPhase: resources
        optional: true
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Bastion ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BastionSlot: ${slot}
        BastionAppGroup: $(BASTION_APP_GROUP)
        BastionAppBundleIdentifier: $(BASTION_APP_BUNDLE_ID)
        NSHumanReadableCopyright: Rules from community filter lists; see the app for licenses.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASTION_APP_BUNDLE_ID).ContentBlocker.${suffix}
        PRODUCT_NAME: Bastion${suffix}Blocker

targets:
  Bastion:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Resources/bastion-compiler.js
          - Resources/catalog.json
      # Generated by `npm run build:compiler` (and by the PrepareRules target).
      - path: App/Resources/bastion-compiler.js
        buildPhase: resources
        optional: true
      - path: App/Resources/catalog.json
        buildPhase: resources
        optional: true
      - path: Shared
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Bastion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BastionAppGroup: $(BASTION_APP_GROUP)
        BastionAppBundleIdentifier: $(BASTION_APP_BUNDLE_ID)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [$(BASTION_APP_BUNDLE_ID).refresh]
    entitlements:
      path: Entitlements/App-${platform}.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASTION_APP_BUNDLE_ID)
        PRODUCT_NAME: Bastion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PrepareRules
      - target: AdsBlocker_${platform}
      - target: PrivacyBlocker_${platform}
      - target: AnnoyancesBlocker_${platform}
      - target: ExtraBlocker_${platform}
      - target: WebExtension_${platform}

  AdsBlocker:
    templates: [ContentBlocker]
    templateAttributes: { slot: ads, suffix: Ads, displayName: Ads }

  PrivacyBlocker:
    templates: [ContentBlocker]
    templateAttributes: { slot: privacy, suffix: Privacy, displayName: Privacy & Security }

  AnnoyancesBlocker:
    templates: [ContentBlocker]
    templateAttributes: { slot: annoyances, suffix: Annoyances, displayName: Annoyances }

  ExtraBlocker:
    templates: [ContentBlocker]
    templateAttributes: { slot: extra, suffix: Extra, displayName: Custom & Overflow }

  WebExtension:
    templates: [BastionExtension]
    sources:
      - path: WebExtension/SafariWebExtensionHandler.swift
      - path: Shared
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Bastion Advanced Blocking
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BastionAppGroup: $(BASTION_APP_GROUP)
        BastionAppBundleIdentifier: $(BASTION_APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASTION_APP_BUNDLE_ID).WebExtension
        PRODUCT_NAME: BastionWebExtension
    postBuildScripts:
      # Safari loads web-extension files from the root of the bundle's Resources.
      - name: Copy web extension resources
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          rsync -a --exclude 'test/' --exclude '.DS_Store' "${PROJECT_DIR}/../extension/" "$DEST/"
        basedOnDependencyAnalysis: false

schemes:
  Bastion_iOS:
    build:
      targets:
        Bastion_iOS: all
    run:
      config: Debug
    archive:
      config: Release
  Bastion_macOS:
    build:
      targets:
        Bastion_macOS: all
    run:
      config: Debug
    archive:
      config: Release
